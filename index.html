:root{--red:#DD1D21;--yellow:#FBCE07;--grey:#6b6b6b;--line:#e4e4e4;--bg:#fafafa;--ink:#222}
*{box-sizing:border-box}
html{font-size:clamp(15px,1.1vw + 11px,20px)}
body{margin:0;font-family:'Jost',system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.wrap{width:min(100% - 2rem,46rem);margin:0 auto;padding:1rem 0 4rem}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;border-bottom:3px solid var(--yellow);padding-bottom:.8rem;margin-bottom:1rem}
h1{font-weight:300;text-transform:uppercase;letter-spacing:.25em;color:var(--grey);font-size:1.1rem;margin:.2rem 0 0}
h1 b{color:var(--red);font-weight:500}
h2{font-weight:300;text-transform:uppercase;letter-spacing:.18em;color:var(--grey);font-size:.95rem;margin:1.2rem 0 .6rem}
.right{display:flex;flex-direction:column;align-items:flex-end;gap:.3rem}
.ver{font-size:.7rem;color:var(--grey);letter-spacing:.1em}
.lang button{border:1px solid var(--line);background:#fff;padding:.25rem .6rem;font:inherit;font-size:.75rem;cursor:pointer;color:var(--grey)}
.lang button.on{background:var(--red);border-color:var(--red);color:#fff}
nav{display:flex;gap:.2rem;margin-bottom:1rem}
nav button{flex:1;border:0;border-bottom:2px solid var(--line);background:none;padding:.6rem .2rem;font:inherit;text-transform:uppercase;letter-spacing:.1em;font-weight:300;font-size:.78rem;color:var(--grey);cursor:pointer}
nav button.on{border-color:var(--red);color:var(--red);font-weight:500}
.card{background:#fff;border:1px solid var(--line);padding:1.1rem;margin-bottom:.8rem}
.btn{display:inline-block;border:0;background:var(--red);color:#fff;padding:.7rem 1.2rem;font:inherit;text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;cursor:pointer;margin:.2rem .2rem 0 0;text-decoration:none}
.btn.alt{background:#fff;color:var(--grey);border:1px solid var(--line)}
.btn.yel{background:var(--yellow);color:#222}
.btn.sm{padding:.4rem .7rem;font-size:.7rem}
.btn.rec{background:#fde8e8;color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.4;cursor:default}
.muted{color:var(--grey);font-size:.85rem}
.step{display:flex;gap:.6rem;align-items:center;padding:.6rem 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.dot{width:1.4rem;height:1.4rem;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:.75rem;flex:none}
.dot.ok{background:var(--yellow);border-color:var(--yellow)}
.phrase{text-align:center;padding:1.2rem .6rem}
.big{font-size:1.9rem;font-weight:300;letter-spacing:.04em;line-height:1.3}
.mean{font-size:1.1rem;margin-top:.8rem;color:var(--red)}
.prog{height:4px;background:var(--line);margin-bottom:.8rem}
.prog i{display:block;height:100%;background:var(--red)}
table{width:100%;border-collapse:collapse}
td{padding:.45rem .3rem;border-bottom:1px solid var(--line);vertical-align:top;font-size:.9rem}
input.t,textarea.t{width:100%;padding:.6rem;border:1px solid var(--line);font:inherit;margin:.25rem 0}
ul{padding-left:1.1rem}
.tag{display:inline-block;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--line);padding:.05rem .4rem;color:var(--grey)}
.tag.ok{background:var(--yellow);border-color:var(--yellow);color:#222}
a{color:var(--red)}
</style>

var KEY="penangHokkienTrainerV2";
function pad(n){return String(n).padStart(2,"0")}
function dstr(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())}
function today(){return dstr(new Date())}
function yesterday(){var d=new Date();d.setDate(d.getDate()-1);return dstr(d)}
var S=load();
function load(){try{var s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===2)return s}catch(e){}return {v:2,lang:"en",spd:1,lp:1,sz:6,custom:[],learned:{},days:{},checked:{},streak:0,lastActive:""}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function t(k){return (UI[S.lang]||UI.en)[k]||UI.en[k]}
function deck(){return SEED.concat(S.custom)}
function meanOf(it){return S.lang==="id"?(it.id_||it.en):S.lang==="ms"?(it.ms||it.en):it.en}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function byId(id){var d=deck();for(var i=0;i<d.length;i++)if(d[i].id===id)return d[i];return null}
function touch(){var td=today();if(S.lastActive===td)return;S.streak=(S.lastActive===yesterday())?S.streak+1:1;S.lastActive=td;save()}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a}

/* ----- today's plan ----- */
function todayRec(){
  var td=today(),r=S.days[td];
  if(!r){
    var fresh=deck().filter(function(it){return !S.learned[it.id]}).slice(0,S.sz).map(function(it){return it.id});
    r={nw:fresh,learnDone:false,reviewed:false};S.days[td]=r;save();
  }
  return r;
}
function reviewIds(){var td=today();return deck().filter(function(it){return S.learned[it.id]&&S.learned[it.id]<td}).map(function(it){return it.id})}

function idb(cb){try{var r=indexedDB.open("hokkienTrainerAudio",1);r.onupgradeneeded=function(){r.result.createObjectStore("a")};r.onsuccess=function(){cb(r.result)};r.onerror=function(){cb(null)}}catch(e){cb(null)}}
var NATIVE={};
function loadKeys(cb){idb(function(d){if(!d)return cb();try{var q=d.transaction("a").objectStore("a").getAllKeys();q.onsuccess=function(){(q.result||[]).forEach(function(k){if(String(k).indexOf("n:")===0)NATIVE[String(k).slice(2)]=1});cb()};q.onerror=function(){cb()}}catch(e){cb()}})}
function getRec(k,cb){idb(function(d){if(!d)return cb(null);try{var q=d.transaction("a").objectStore("a").get(k);q.onsuccess=function(){cb(q.result)};q.onerror=function(){cb(null)}}catch(e){cb(null)}})}
function putRec(k,b,cb){idb(function(d){if(!d)return cb();var x=d.transaction("a","readwrite");x.objectStore("a").put(b,k);x.oncomplete=function(){if(String(k).indexOf('n:')===0)NATIVE[String(k).slice(2)]=1;cb()};x.onerror=function(){cb()}})}
function clearRecs(cb){NATIVE={};idb(function(d){if(!d)return cb();var x=d.transaction("a","readwrite");x.objectStore("a").clear();x.oncomplete=function(){cb()};x.onerror=function(){cb()}})}
function toast(m){var d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;left:50%;bottom:1.2rem;transform:translateX(-50%);background:#222;color:#fff;padding:.6rem 1rem;font-size:.85rem;max-width:90%;z-index:9";document.body.appendChild(d);setTimeout(function(){d.remove()},3800)}
var curAudio=null;
function playKey(k,cb){getRec(k,function(b){if(!b){cb&&cb(false);return}if(curAudio){try{curAudio.pause()}catch(e){}}var a=new Audio(URL.createObjectURL(b));curAudio=a;a.onended=function(){cb&&cb(true)};a.play().catch(function(){cb&&cb(false)})})}
var LT=0;
function playLoop(id){
  var tok=++LT,i=0;
  function go(){
    getRec("n:"+id,function(bl){
      if(tok!==LT)return;
      if(!bl){toast(t("none"));return}
      if(curAudio){try{curAudio.pause()}catch(e){}}
      var a=new Audio(URL.createObjectURL(bl));a.playbackRate=S.spd;try{a.preservesPitch=true}catch(e){}curAudio=a;
      a.onended=function(){var d=(a.duration&&isFinite(a.duration))?a.duration/S.spd*1000:1500;URL.revokeObjectURL(a.src);i++;if(i<S.lp&&tok===LT)setTimeout(go,d+400)};
      a.play().catch(function(){toast(t("none"))});
    });
  }
  go();
}
var R=null;
function recKey(k,btn){
  if(R){R.mr.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){toast(t("nomic"));return}
  navigator.mediaDevices.getUserMedia({audio:true}).then(function(st){
    var mr=new MediaRecorder(st),ch=[],label=btn.getAttribute("data-label");R={mr:mr};
    btn.textContent="■ "+t("stop");btn.classList.add("rec");
    mr.ondataavailable=function(e){if(e.data.size)ch.push(e.data)};
    mr.onstop=function(){st.getTracks().forEach(function(x){x.stop()});var b=new Blob(ch,{type:mr.mimeType||"audio/webm"});R=null;btn.textContent=label;btn.classList.remove("rec");putRec(k,b,function(){toast(t("saved")+" ✓");if(k.indexOf("n:")===0)render()})};
    mr.start();
  }).catch(function(){toast(t("nomic"))});
}
function audioRow(it){
  var n="n:"+it.id,m="m:"+it.id,has=NATIVE[it.id];
  function b(a,k,label,cls){return '<button class="btn sm '+(cls||"alt")+'" data-a="'+a+'" data-k="'+esc(k)+'" data-label="'+esc(label)+'">'+label+'</button>'}
  function chips(a,vals,cur,fmt){return vals.map(function(v){return '<button class="btn sm '+(v===cur?"":"alt")+'" data-a="'+a+'" data-k="'+v+'">'+fmt(v)+'</button>'}).join("")}
  var h='<div style="margin-top:.8rem"><span class="tag '+(has?"ok":"")+'">'+(has?t("hasAudio"):t("noAudio"))+'</span></div>';
  if(has){h+=b("playn",it.id,"▶ "+t("listen"),"")+'<div class="muted" style="margin-top:.5rem">'+t("speed")+'</div>'+chips("spd",[0.6,0.8,1],S.spd,function(v){return v+"x"})+'<div class="muted" style="margin-top:.5rem">'+t("loop")+'</div>'+chips("lp",[1,3,5],S.lp,function(v){return v+"×"})+'<div class="muted" style="margin-top:.4rem">'+t("shadow")+'</div>'}
  else h+='<div class="muted" style="margin:.4rem 0">'+t("noAudioHelp")+'</div>';
  h+='<div style="margin-top:.6rem">'+b("rec",n,"● "+t("recNative"))+'</div>';
  h+='<div class="muted" style="margin-top:.8rem">'+t("mine")+'</div>'+b("play",m,"▶ "+t("play"))+b("rec",m,"● "+t("rec"))+(has?b("cmp",it.id,"⇄ "+t("compare"),"yel"):"");
  return h;
}

/* ----- shell ----- */
var tab="today",sub=null,C=null;
function chrome(){
  document.documentElement.lang=S.lang;
  document.getElementById("sub").textContent=t("sub");
  document.getElementById("lang").innerHTML=["en","id","ms"].map(function(l){return '<button class="'+(S.lang===l?"on":"")+'" data-l="'+l+'">'+l.toUpperCase()+'</button>'}).join("");
  document.getElementById("nav").innerHTML=["today","sounds","deck","plan"].map(function(x){return '<button class="'+(tab===x?"on":"")+'" data-t="'+x+'">'+t(x)+'</button>'}).join("");
}
document.addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b)return;
  if(b.dataset.l){S.lang=b.dataset.l;save();render();return}
  if(b.dataset.t){LT++;tab=b.dataset.t;sub=null;C=null;render();return}
  if(b.dataset.a)act(b.dataset.a,b.dataset.k,b);
});
function render(){chrome();var v=document.getElementById("view");({today:rToday,sounds:rSounds,deck:rDeck,plan:rPlan})[tab](v)}
function act(a,k,b){
  if(a==="learn"){var r=todayRec();C={mode:"learn",list:r.nw.map(byId).filter(Boolean),i:0,open:true,miss:[]};sub="cards";render()}
  else if(a==="review"){C={mode:"review",list:shuffle(reviewIds()).map(byId).filter(Boolean),i:0,open:false,miss:[]};sub="cards";render()}
  else if(a==="back"){LT++;sub=null;C=null;render()}
  else if(a==="reveal"){C.open=true;render()}
  else if(a==="next"){C.i++;C.open=C.mode==="learn";render()}
  else if(a==="said"){C.i++;C.open=false;render()}
  else if(a==="again"){C.miss.push(C.list[C.i]);C.i++;C.open=false;render()}
  else if(a==="playn"){playLoop(k)}
  else if(a==="spd"){S.spd=+k;save();render()}
  else if(a==="lp"){S.lp=+k;save();render()}
  else if(a==="sheet"){sub="sheet";SH=0;render()}
  else if(a==="sp"){SH=Math.max(0,SH-1);render()}
  else if(a==="sn"){SH=Math.min(deck().length-1,SH+1);render()}
  else if(a==="csv"){exportCsv()}
  else if(a==="play"){playKey(k,function(ok){if(!ok)toast(t("none"))})}
  else if(a==="rec"){recKey(k,b)}
  else if(a==="cmp"){playKey("n:"+k,function(ok){if(!ok){toast(t("none"));return}setTimeout(function(){playKey("m:"+k)},300)})}
  else if(a==="chk"){S.checked[k]=!S.checked[k];save();render()}
  else if(a==="del"){S.custom=S.custom.filter(function(x){return x.id!==k});save();render()}
  else if(a==="add"){addOne()}
  else if(a==="imp"){importLines()}
  else if(a==="sz"){S.sz=+k;save();var td=today();if(S.days[td]&&!S.days[td].learnDone)delete S.days[td];save();render()}
  else if(a==="reset"){if(confirm(t("confirm"))){var l=S.lang;S={v:2,lang:l,spd:1,lp:1,sz:6,custom:[],learned:{},days:{},checked:{},streak:0,lastActive:""};save();clearRecs(function(){sub=null;C=null;render()})}}
}

/* ----- today ----- */
function stepRow(n,label,ok,a,enabled){return '<div class="step"><div class="dot '+(ok?"ok":"")+'">'+(ok?"✓":n)+'</div><div style="flex:1">'+label+'</div><button class="btn '+(ok?"alt":"")+'" '+(enabled?"":"disabled")+' data-a="'+a+'">'+(ok?t("open"):t("start"))+'</button></div>'}
function rToday(v){
  if(sub==="cards"&&C)return rCards(v);
  var r=todayRec(),rv=reviewIds(),h='<div class="card muted">'+t("streak")+': <b>'+S.streak+'</b> · '+t("learned")+': <b>'+Object.keys(S.learned).length+'</b> · '+deck().length+' '+t("deckCount")+'</div>';
  if(!r.nw.length&&!rv.length){v.innerHTML=h+'<div class="card">'+t("noNew")+'</div>';return}
  var nOk=r.learnDone||!r.nw.length,rOk=r.reviewed||!rv.length;
  h+='<div class="card">'+stepRow(1,t("step1")+(r.nw.length?" ("+r.nw.length+")":""),r.learnDone,"learn",r.nw.length>0)+stepRow(2,t("step2")+(rv.length?" ("+rv.length+")":""),rOk,"review",rv.length>0&&!r.reviewed||r.reviewed)+'</div>';
  if(!rv.length)h+='<div class="card muted">'+t("noReview")+'</div>';
  if(!r.nw.length)h+='<div class="card muted">'+t("noNew")+'</div>';
  if(r.learnDone&&(r.reviewed||!rv.length))h+='<div class="card">'+t("finished")+'</div>';
  v.innerHTML=h;
}
function rCards(v){
  var it=C.list[C.i];
  if(!it){return finish(v)}
  var h='<div class="prog"><i style="width:'+(C.i/C.list.length*100)+'%"></i></div><div class="muted">'+(C.i+1)+' / '+C.list.length+'</div><div class="card"><div class="phrase">';
  if(C.mode==="learn"){h+='<div class="big">'+esc(it.tj)+'</div><div class="mean">'+esc(meanOf(it))+'</div></div>'+audioRow(it)+'</div><button class="btn" data-a="next">'+t("next")+'</button>'}
  else{
    h+='<div class="mean" style="margin:0">'+esc(meanOf(it))+'</div>';
    if(!C.open){h+='<div class="muted" style="margin-top:.8rem">'+t("firstDay")+'</div></div></div><button class="btn" data-a="reveal">'+t("tapCheck")+'</button>'}
    else{h+='<div class="big" style="margin-top:.8rem">'+esc(it.tj)+'</div></div>'+audioRow(it)+'</div><button class="btn yel" data-a="said">'+t("said")+'</button><button class="btn alt" data-a="again">'+t("again")+'</button>'}
  }
  h+='<div><button class="btn alt sm" data-a="back">'+t("back")+'</button></div>';
  v.innerHTML=h;
}
function finish(v){
  var c=C;C=null;sub=null;var r=todayRec(),td=today();
  if(c.mode==="learn"){r.nw.forEach(function(id){S.learned[id]=td});r.learnDone=true}else{r.reviewed=true}
  save();touch();
  var h='<div class="card"><h2 style="margin-top:0">'+(c.mode==="learn"?t("done"):t("reviewDone"))+' ✓</h2>';
  if(c.miss.length){h+='<div class="muted">'+t("revisit")+'</div><table>'+c.miss.map(function(it){return '<tr><td><b>'+esc(it.tj)+'</b></td><td>'+esc(meanOf(it))+'</td></tr>'}).join("")+'</table>'}
  v.innerHTML=h+'</div><button class="btn" data-a="back">'+t("back")+'</button>';
}

/* ----- sounds ----- */
function rSounds(v){
  v.innerHTML='<div class="card"><h2 style="margin-top:0">'+t("guideT")+'</h2>'+t("guide").map(function(l,i){return i===0?'<p>'+esc(l)+'</p>':'<div style="margin:.3rem 0">'+esc(l)+'</div>'}).join("")+'</div>';
}

/* ----- deck ----- */
function addOne(){
  var tj=document.getElementById("f-tj").value.trim(),en=document.getElementById("f-en").value.trim();
  if(!tj||!en)return;
  S.custom.push({id:"c"+Date.now()+Math.floor(Math.random()*1000),tj:tj,en:en,id_:document.getElementById("f-id").value.trim(),ms:document.getElementById("f-ms").value.trim()});
  save();render();
}
function importLines(){
  var lines=document.getElementById("f-imp").value.split(/\r?\n/),n=0;
  lines.forEach(function(l){var p=l.split("|").map(function(x){return x.trim()});if(p[0]&&p[1]){S.custom.push({id:"c"+Date.now()+"-"+(n++)+Math.floor(Math.random()*1000),tj:p[0],en:p[1],id_:p[2]||"",ms:p[3]||""})}});
  save();render();
}
var SH=0;
function exportCsv(){
  var rows=[["id","taiji","english"]].concat(deck().map(function(it){return [it.id,it.tj,it.en]}));
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"'}).join(",")}).join("\n");
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="penang-hokkien-phrases.csv";document.body.appendChild(a);a.click();a.remove();
}
function importAudio(files){
  var d=deck(),ok=0,bad=[],n=files.length;
  if(!n)return;
  Array.prototype.forEach.call(files,function(f){
    var base=f.name.replace(/\.[^.]+$/,"").toLowerCase().replace(/_slow$/,"");
    var it=null;for(var i=0;i<d.length;i++)if(String(d[i].id).toLowerCase()===base)it=d[i];
    if(!it){bad.push(f.name);if(--n===0)done();return}
    putRec("n:"+it.id,f,function(){ok++;if(--n===0)done()});
  });
  function done(){toast(t("imported")+": "+ok+(bad.length?" · "+bad.length+" "+t("unmatched")+": "+bad.slice(0,3).join(", "):""));render()}
}
document.addEventListener("change",function(e){if(e.target&&e.target.id==="f-aud"){importAudio(e.target.files)}});
function rSheet(v){
  var d=deck(),it=d[SH];
  if(!it){sub=null;render();return}
  var n="n:"+it.id,has=NATIVE[it.id];
  v.innerHTML='<div class="prog"><i style="width:'+((SH+1)/d.length*100)+'%"></i></div><div class="muted">'+(SH+1)+' / '+d.length+' · ID '+esc(it.id)+'</div><div class="card"><div class="phrase"><div class="big">'+esc(it.tj)+'</div><div class="mean">'+esc(it.en)+'</div></div><p class="muted">'+esc(t("sheetHelp"))+'</p><span class="tag '+(has?"ok":"")+'">'+(has?t("hasAudio"):t("noAudio"))+'</span><div style="margin-top:.6rem"><button class="btn" data-a="rec" data-k="'+esc(n)+'" data-label="● '+esc(t("rec"))+'">● '+t("rec")+'</button>'+(has?'<button class="btn alt" data-a="playn" data-k="'+esc(it.id)+'">▶ '+t("play")+'</button>':'')+'</div></div><button class="btn alt" data-a="sp">'+t("prev")+'</button><button class="btn yel" data-a="sn">'+t("next")+'</button><div><button class="btn alt sm" data-a="back">'+t("back")+'</button></div>';
}
function rDeck(v){
  if(sub==="sheet")return rSheet(v);
  var h='<div class="card"><b>'+t("perDay")+'</b><div>'+[4,6,8,10].map(function(n){return '<button class="btn sm '+(S.sz===n?"":"alt")+'" data-a="sz" data-k="'+n+'">'+n+'</button>'}).join("")+'</div></div>';
  h+='<div class="card"><button class="btn" data-a="sheet">'+t("sheet")+'</button><div style="margin-top:.6rem"><b>'+t("importAudio")+'</b><input class="t" type="file" id="f-aud" accept="audio/*" multiple></div><button class="btn alt sm" data-a="csv">'+t("csv")+'</button></div>';
  h+='<div class="card"><b>'+t("add")+'</b><input class="t" id="f-tj" placeholder="'+esc(t("taiji"))+'"><input class="t" id="f-en" placeholder="'+esc(t("en"))+'"><input class="t" id="f-id" placeholder="'+esc(t("idm"))+'"><input class="t" id="f-ms" placeholder="'+esc(t("msm"))+'"><button class="btn" data-a="add">'+t("addBtn")+'</button></div>';
  h+='<div class="card"><b>'+t("importT")+'</b><div class="muted">'+esc(t("importHint"))+'</div><textarea class="t" id="f-imp" rows="4"></textarea><button class="btn" data-a="imp">'+t("importBtn")+'</button></div>';
  h+='<div class="card"><table>'+deck().map(function(it){var ck=!!S.checked[it.id],cu=it.id[0]==="c";return '<tr><td><b>'+esc(it.tj)+'</b><br><span class="muted">'+esc(meanOf(it))+'</span></td><td style="text-align:right"><button class="btn sm alt" data-a="chk" data-k="'+it.id+'"><span class="tag '+(ck?"ok":"")+'">'+(ck?"✓ "+t("checked"):t("unchecked"))+'</span></button>'+(cu?'<button class="btn sm alt" data-a="del" data-k="'+it.id+'">'+t("del")+'</button>':"")+'</td></tr>'}).join("")+'</table></div>';
  h+='<p class="muted">'+esc(t("source"))+'</p><button class="btn alt" data-a="reset">'+t("reset")+'</button>';
  v.innerHTML=h;
}

/* ----- plan ----- */
function rPlan(v){
  v.innerHTML='<div class="card"><h2 style="margin-top:0">'+t("routine")+'</h2>'+t("routineL").map(function(l){return '<div style="margin:.3rem 0">'+esc(l)+'</div>'}).join("")+'</div><div class="card"><h2 style="margin-top:0">'+t("sitTitle")+'</h2>'+t("weeks").map(function(l){return '<div style="margin:.3rem 0">• '+esc(l)+'</div>'}).join("")+'</div>';
}
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js").catch(function(){})}catch(e){}})}
loadKeys(function(){render()});
</script>
